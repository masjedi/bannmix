<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Slab:wght@800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <title>BanMix — Majoon from Kabul</title>
        <script>
            (function () {
                try {
                    var key = "banmix-theme";
                    var stored = localStorage.getItem(key);
                    var theme =
                        stored === "light" || stored === "dark"
                            ? stored
                            : window.matchMedia(
                                  "(prefers-color-scheme: dark)"
                              ).matches
                              ? "dark"
                              : "light";
                    var root = document.documentElement;
                    if (theme === "dark") {
                        root.classList.add("dark");
                    } else {
                        root.classList.remove("dark");
                    }
                    root.dataset.theme = theme;
                    root.style.colorScheme = theme;
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
